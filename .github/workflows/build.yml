name: Build Copilot VSIX

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - name: Detect unreleased VSCodium versions
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions we have already published
          existing=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[].tag_name | ltrimstr("v")]' 2>/dev/null || echo '[]')

          # Walk the git history of upstream/stable.json in the VSCodium repo.
          # Each commit that touched it represents a VSCodium release, giving us
          # both the VS Code tag and the exact commit hash VSCodium built from.
          shas=$(gh api "repos/VSCodium/vscodium/commits?path=upstream/stable.json&per_page=20" \
            --jq '.[].sha')

          new='[]'
          declare -A seen
          while IFS= read -r sha; do
            entry=$(curl -sf "https://raw.githubusercontent.com/VSCodium/vscodium/${sha}/upstream/stable.json") || continue
            tag=$(echo "$entry" | jq -r '.tag // empty')
            commit=$(echo "$entry" | jq -r '.commit // empty')

            if [[ -z "$tag" || -n "${seen[$tag]}" ]]; then
              continue
            fi
            seen[$tag]=1

            # Commits come back newest-first, so the first already-released tag
            # marks the point where everything older has been handled before.
            if jq -e --arg t "$tag" 'index($t)' <<< "$existing" > /dev/null; then
              break
            fi

            new=$(jq -cn --argjson vs "$new" --arg t "$tag" --arg c "$commit" \
              '$vs + [{"tag": $t, "commit": $c}]')
          done <<< "$shas"

          # On a repo without any release yet there is no cut-off point, so only
          # process the most recent version instead of the whole history.
          if [[ "$existing" == '[]' ]]; then
            new=$(jq -c '.[0:1]' <<< "$new")
          fi

          echo "Versions to build: $(echo "$new" | jq -r '[.[].tag] | join(", ")')"
          echo "versions=$new" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.versions != '[]' && needs.detect.outputs.versions != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.detect.outputs.versions) }}
      fail-fast: false
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Checkout microsoft/vscode at ${{ matrix.version.commit }} (${{ matrix.version.tag }})
        run: |
          git init vscode
          git -C vscode remote add origin https://github.com/microsoft/vscode.git
          git -C vscode fetch --depth 1 origin ${{ matrix.version.commit }}
          git -C vscode checkout FETCH_HEAD

      - name: Check extensions/copilot exists
        id: check
        run: |
          if [[ -d vscode/extensions/copilot ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::extensions/copilot not found in VS Code ${{ matrix.version.tag }}, skipping."
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: vscode/extensions/copilot
        run: npm install

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: vscode/extensions/copilot
        env:
          BUILD_SOURCEVERSION: ${{ matrix.version.commit }}
          VSCODE_QUALITY: stable
        run: npm run build

      - name: Package VSIX
        if: steps.check.outputs.exists == 'true'
        working-directory: vscode/extensions/copilot
        run: npx @vscode/vsce package --no-dependencies --allow-package-secrets sendgrid

      - name: Read extension metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        working-directory: vscode/extensions/copilot
        run: |
          ext_ver=$(node -p "require('./package.json').version")
          echo "ext_version=${ext_ver}" >> "$GITHUB_OUTPUT"
          echo "vsix=copilot-chat-${ext_ver}.vsix" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'true'
        working-directory: vscode/extensions/copilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md << 'NOTES'
          Built from [microsoft/vscode@`${{ matrix.version.commit }}`](https://github.com/microsoft/vscode/commit/${{ matrix.version.commit }}) (VS Code ${{ matrix.version.tag }}).

          ## Install in VSCodium

          Download `${{ steps.meta.outputs.vsix }}` from the assets below and run:

          ```bash
          codium --install-extension ${{ steps.meta.outputs.vsix }}
          ```

          > **Note:** Requires a [GitHub Copilot subscription](https://github.com/features/copilot).
          NOTES

          gh release create "v${{ matrix.version.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Copilot Chat ${{ steps.meta.outputs.ext_version }} (VS Code ${{ matrix.version.tag }})" \
            --notes-file notes.md \
            "${{ steps.meta.outputs.vsix }}"
