name: Build Copilot VSIX

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - name: Detect new VS Code versions
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch the 20 most recent VS Code releases
          vscode_versions=$(gh api "repos/microsoft/vscode/releases?per_page=20" \
            --jq '[.[].tag_name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))]')

          # Fetch tags of existing releases in this repo (strip leading "v")
          existing=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[].tag_name | ltrimstr("v")]' 2>/dev/null || echo "[]")

          # Compute set difference: versions in vscode but not yet released here
          new=$(jq -n \
            --argjson vs "$vscode_versions" \
            --argjson ex "$existing" \
            '$vs - $ex')

          echo "Found new versions: $new"
          echo "versions=$new" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.versions != '[]' && needs.detect.outputs.versions != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.detect.outputs.versions) }}
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone microsoft/vscode at ${{ matrix.version }}
        run: git clone --depth 1 --branch ${{ matrix.version }} https://github.com/microsoft/vscode.git

      - name: Install dependencies
        working-directory: vscode/extensions/copilot
        run: npm install

      - name: Build
        working-directory: vscode/extensions/copilot
        run: npm run build

      - name: Package VSIX
        working-directory: vscode/extensions/copilot
        run: npx @vscode/vsce package --no-dependencies

      - name: Read extension metadata
        id: meta
        working-directory: vscode/extensions/copilot
        run: |
          ext_ver=$(node -p "require('./package.json').version")
          echo "ext_version=${ext_ver}" >> "$GITHUB_OUTPUT"
          echo "vsix=copilot-chat-${ext_ver}.vsix" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        working-directory: vscode/extensions/copilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ matrix.version }}" \
            --repo "${{ github.repository }}" \
            --title "Copilot Chat ${{ steps.meta.outputs.ext_version }} (VS Code ${{ matrix.version }})" \
            --notes "Built from [microsoft/vscode@${{ matrix.version }}](https://github.com/microsoft/vscode/releases/tag/${{ matrix.version }}).

## Install in VSCodium

Download \`${{ steps.meta.outputs.vsix }}\` from the assets below and run:

\`\`\`bash
codium --install-extension ${{ steps.meta.outputs.vsix }}
\`\`\`

> **Note:** Requires a [GitHub Copilot subscription](https://github.com/features/copilot)." \
            "${{ steps.meta.outputs.vsix }}"
